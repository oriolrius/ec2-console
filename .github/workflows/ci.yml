name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    # Lints the workflow YAML and shellchecks embedded run: scripts; also flags
    # unpinned/unsafe action usage. Bump ACTIONLINT_VERSION to update.
    env:
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          actionlint --version
      - name: Lint workflows
        run: actionlint -color

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint tracked shell scripts
        run: git ls-files '*.sh' | xargs shellcheck --severity=warning

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt (check)
        run: terraform fmt -check -recursive dbai/terraform
      - name: terraform validate (each root)
        run: |
          set -euo pipefail
          for root in \
            dbai/terraform/address \
            dbai/terraform/workspace \
            dbai/terraform/examples/s6-student-root; do
            echo "== validating ${root} =="
            terraform -chdir="${root}" init -backend=false -input=false
            terraform -chdir="${root}" validate
          done

  profiles:
    name: Profile catalog validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Validate profile catalog (+ selftest)
        run: |
          uv run --with pyyaml python3 dbai/profiles/validate-profiles.py --selftest
          uv run --with pyyaml python3 dbai/profiles/validate-profiles.py
