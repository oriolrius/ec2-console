name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Run the pinned gitleaks BINARY directly (not gitleaks-action) — no
    # GITHUB_TOKEN/license machinery, one fewer third-party action in the trust
    # chain, and identical to the local scan. Bump GITLEAKS_VERSION to update.
    env:
      GITLEAKS_VERSION: "8.24.3"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --source . --no-banner --redact --verbose

  secret-sentinel:
    name: Repo secret sentinel (dbai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked dbai files for private keys / credential values
        run: bash dbai/scripts/secret-sentinel.sh

  checkov:
    name: IaC scan (checkov)
    runs-on: ubuntu-latest
    # Static analysis of the Terraform. Current findings are baselined in
    # .checkov.yaml (accepted-by-design, with justification); anything new
    # hard-fails. Bump CHECKOV_VERSION to update.
    env:
      CHECKOV_VERSION: "3.3.19"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Checkov (Terraform, baselined via .checkov.yaml)
        run: uvx "checkov@${CHECKOV_VERSION}" --config-file .checkov.yaml
