# DBAI phase-profile catalog (PROFILE-01, doc-18 §5).
#
# A profile pins EXACTLY which module, bootstrap, platform and tools prepared an
# environment, so teaching/exam behavior cannot drift through implicit upgrades.
# Profiles here are `candidate` — they are frozen and qualified by later tasks
# (PROFILE-05/06/08/10/11, capacity + boot-time). A changed tool/module/
# bootstrap input requires a NEW profile version (never edit a published one).
#
# Placeholder tokens (TBD/latest/…) are rejected by validate-profiles.py. A
# value that is genuinely not decided yet is `null` (explicitly pending), which
# is allowed for candidates but never for a qualified reference.
schema: dbai/profile-catalog/v1
baseline_version: "1.0.0"
ec2_console_version: 7a0fa4f2b5512e8b34d8dee11e9779c806ad2752   # candidate pin
bootstrap_sha256: sha256:9ec13d6b09e61714de88d51bdd0bc5b9e3d43e1434cc0d478a0a268699fd6a06

profiles:
  - name: foundations
    version: foundations-0.1.0
    status: candidate
    phases: [S2, S3]
    ubuntu: "24.04"
    ami: ami-03957e4cfe042cca1        # Ubuntu 24.04 LTS, eu-west-1
    instance_size: t3.small
    module_revision: null              # pending RECOVERY-01
    bootstrap_sha256: sha256:9ec13d6b09e61714de88d51bdd0bc5b9e3d43e1434cc0d478a0a268699fd6a06
    tools:                             # version pins are future deliverables (null=pending)
      ssh: distro
      git: distro
      uv: null
