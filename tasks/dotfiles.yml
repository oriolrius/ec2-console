---
# chezmoi (dotfiles manager) + GitHub CLI.
# gh authenticates the VM to GitHub so chezmoi can clone a private dotfiles
# repo. Nothing is applied automatically — see docs/TUTORIAL-chezmoi.md.

- name: Install chezmoi
  shell: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
  args:
    creates: /usr/local/bin/chezmoi

- name: Add GitHub CLI signing key
  get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'

- name: Add GitHub CLI repository
  copy:
    dest: /etc/apt/sources.list.d/github-cli.list
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main\n"
    mode: '0644'

- name: Install GitHub CLI
  apt:
    name: gh
    state: present
    update_cache: true
