---
- name: Provision EC2 console workstation
  hosts: all
  become: true
  vars:
    ubuntu_home: /home/ubuntu
    # Keyboard layout of the Chrome Remote Desktop session (setxkbmap name):
    # us, es, fr, de, gb, ... Override with: -e keyboard_layout=es
    keyboard_layout: us
    # Desktop Chrome (tasks/browser.yml): quiet policies (no save-password,
    # default-browser, promo or first-run prompts) and optional CDP on
    # 127.0.0.1:chrome_cdp_port with its own profile (~/.config/google-chrome-cdp).
    chrome_quiet_policies: true
    chrome_cdp_enabled: false
    chrome_cdp_port: 9222
    # Auto-stop when idle (tasks/idle-stop.yml): no desktop or terminal input for
    # idle_stop_minutes and a 5-minute load below idle_stop_max_load -> save
    # chezmoi and stop the instance. Resume with scripts/resume.sh.
    idle_stop_enabled: true
    idle_stop_minutes: 60
    idle_stop_max_load: "1.0"
    # DeepSeek Harness (tasks/deepseek-harness.yml). The key is NOT a default:
    # pass -e litellm_api_key=sk-... once (stored in dsh_home/.env, mode 600).
    nodejs_major: 22
    dsh_version: latest
    dsh_home: "{{ ubuntu_home }}/deepseek-harness/.dsh"
    litellm_base_url: https://litellm.joor.net/v1
    # Course keys allow the "course-chat" alias (nan.builders DeepSeek V4 Flash).
    dsh_model: course-chat
    # DeepSeek Harness web UI fonts (ui-theme plugin). Ranges: text 10-22,
    # code 10-16, terminal 10-20. Default family = the Kitty/shell font.
    dsh_font_size: 18
    dsh_code_font_size: 16
    dsh_terminal_font_size: 18
    dsh_font_family: '"JetBrainsMono Nerd Font Mono", monospace'
    # CRD session recorder (tasks/recorder.yml)
    crd_recorder_user: ubuntu
    crd_recorder_dir: "{{ ubuntu_home }}/recordings"
    crd_recorder_fps: 1
    crd_recorder_segment_seconds: 3600
    # Whether recording is on after the first install (later runs keep the
    # user's choice made in the CRD Recorder app).
    crd_recorder_enabled: true
    # Release of the CRD Recorder app to install ("latest" or a tag such as v1.8.0).
    # Set crd_recorder_gui_src=<path> to install a local build instead.
    crd_recorder_gui_version: latest
    crd_recorder_gui_url: >-
      https://github.com/oriolrius/ec2-console/releases/{{ 'latest/download' if crd_recorder_gui_version == 'latest'
      else 'download/' ~ crd_recorder_gui_version }}/crd-recorder-gui-linux-amd64

  # Personal settings: local.yml next to this playbook (git-ignored; copy
  # local.yml.example). Its values override the defaults above; -e still wins.
  pre_tasks:
    - name: Load personal settings (local.yml) if present
      include_vars: "{{ playbook_dir }}/local.yml"
      when: lookup('ansible.builtin.fileglob', playbook_dir ~ '/local.yml') | length > 0
      tags: [always]

  tasks:
    - name: System baseline
      tags: [base, always]
      import_tasks: tasks/base.yml

    - name: AWS CLI v2
      tags: [awscli]
      import_tasks: tasks/awscli.yml

    - name: Docker CE + Compose
      tags: [docker]
      import_tasks: tasks/docker.yml

    - name: Kubernetes tooling (kubectl, helm, eksctl, kind)
      tags: [kubernetes]
      import_tasks: tasks/kubernetes.yml

    - name: UV package manager
      tags: [uv]
      import_tasks: tasks/uv.yml

    - name: Micromamba package manager
      tags: [micromamba]
      import_tasks: tasks/micromamba.yml

    - name: XFCE desktop + Chrome Remote Desktop
      tags: [desktop]
      import_tasks: tasks/desktop.yml

    - name: CRD session recorder (systemd + ffmpeg) and the CRD Recorder app
      tags: [recorder]
      import_tasks: tasks/recorder.yml

    - name: Terminal tooling (Kitty, Nerd Fonts, oh-my-posh, Zellij, herdr)
      tags: [terminal]
      import_tasks: tasks/terminal.yml

    - name: Dotfiles (chezmoi + chezit + GitHub CLI)
      tags: [dotfiles]
      import_tasks: tasks/dotfiles.yml

    - name: DeepSeek Harness (dsh) through the LiteLLM gateway
      tags: [deepseek-harness]
      import_tasks: tasks/deepseek-harness.yml

    - name: Auto-stop when idle (saves chezmoi first)
      tags: [idle-stop]
      import_tasks: tasks/idle-stop.yml

    - name: Visual Studio Code
      tags: [vscode]
      import_tasks: tasks/vscode.yml

    - name: Google Chrome browser
      tags: [browser]
      import_tasks: tasks/browser.yml

    - name: Project — JupyterLab (UV)
      tags: [projects, jupyterlab-uv]
      import_tasks: tasks/project-jupyterlab-uv.yml

    - name: Project — JupyterLab (Micromamba)
      tags: [projects, jupyterlab-micromamba]
      import_tasks: tasks/project-jupyterlab-micromamba.yml

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: true

    # try-restart: only if it is running; a recorder the user stopped stays stopped.
    - name: Restart crd-recorder
      command: systemctl try-restart crd-recorder.service
