# Checkov configuration for the DBAI Terraform (dbai/terraform).
#
# Baseline model: the checks below are ACCEPTED for a disposable, single-user
# course VM and skipped WITH JUSTIFICATION. Anything not listed here hard-fails
# CI, so any NEW misconfiguration is caught.
#
# The former hardening gaps CKV_AWS_79 (require IMDSv2) and CKV2_AWS_12 (lock
# the default SG) have been FIXED in modules/workspace (PR #9, live-verified)
# and are no longer skipped — Checkov now enforces them, so a regression fails.
directory:
  - dbai/terraform
compact: true
quiet: true
skip-check:
  # --- Accepted by design (disposable course workstation) ---
  - CKV_AWS_24    # SSH 22 open to 0.0.0.0/0 — key-only auth; students connect from anywhere (README "Access methods").
  - CKV_AWS_382   # Egress to 0.0.0.0/0 — the workstation needs outbound apt/git/GitHub/Chrome Remote Desktop.
  - CKV_AWS_126   # Detailed monitoring — extra cost, unnecessary for a throwaway course VM.
  - CKV_AWS_135   # EBS-optimized flag — t3 instances are EBS-optimized by default; the attribute is a no-op.
  - CKV2_AWS_19   # EIP not attached — by design (ENV-03): the address is decoupled and outlives the VM across rebuilds.
  - CKV2_AWS_11   # VPC flow logs — adds CloudWatch/S3 + IAM; out of scope/cost for a single-user course VM.
  - CKV2_AWS_41   # No IAM role on the instance — intentional; the VM carries no AWS privileges.
