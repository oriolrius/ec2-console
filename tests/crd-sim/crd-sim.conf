# TEST ONLY — /etc/systemd/system/chrome-remote-desktop@ubuntu.service.d/crd-sim.conf
# Runs the CRD session simulator instead of the real (unregistered) CRD host;
# everything else of the real unit (User=, PAMName=, environment) is kept.
# The CRD script path is passed so it appears in our command line, as it does
# in the real host's.
[Service]
ExecStart=
ExecStart=/usr/local/bin/crd-sim /opt/google/chrome-remote-desktop/chrome-remote-desktop
ExecReload=
ExecStop=
# SIGTERM to crd-sim only, which tears down session then Xorg like CRD does.
KillMode=mixed
